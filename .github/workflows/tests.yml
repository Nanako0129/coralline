name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces the older run. A push to main gets a
# group of its own (the commit), so no run on main is cancelled or left pending
# behind another: each merge commit keeps its own result, and a break is
# attributed to the commit that caused it.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bash:
    # ubuntu-latest has bash 5 on PATH; macos-latest has only the stock bash 3.2,
    # the oldest shell the renderer supports. The Versions step fails if that
    # stops being true, so the macOS leg cannot silently stop covering 3.2.
    name: bash suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          bash --version | head -1
          jq --version
          git --version
          if [ "$RUNNER_OS" = macOS ]; then
            case "$(bash -c 'printf %s "$BASH_VERSION"')" in
              3.2.*) ;;
              *) echo "::error::the macOS runner's bash is no longer 3.2; this leg must run the suites under /bin/bash"; exit 1 ;;
            esac
          fi
      # One file per invocation: `bash -n a b c` checks only a and passes the
      # rest to it as arguments.
      - name: Syntax
        run: |
          fail=0
          for f in statusline.sh configure.sh install.sh example/float-display-iterm2/coralline-float test/*.sh; do
            bash -n "$f" || { fail=1; echo "::error file=$f::syntax error"; }
          done
          exit "$fail"
      # Every suite exits non-zero on a failed case. The loop keeps going so one
      # run names every failing suite. Each suite gets an empty HOME of its own, so
      # here whatever a suite reads or leaves under ~/.claude is its own and the
      # result does not depend on the order of the suites. That isolation is this
      # workflow's: run by hand, a suite uses the real HOME.
      # A failed suite is run once more before it counts: several cases bound
      # real concurrency by wall-clock time (test-burn's 32 simultaneous renders
      # with one writer per second), written for a local machine, and a loaded
      # shared runner can overrun them. A real break fails both times; a retry
      # leaves a warning on the run so a recurring one is seen.
      - name: Suites
        run: |
          fail=0
          for t in test/*.sh; do
            echo "::group::$t"
            if ! HOME="$(mktemp -d)" bash "$t"; then
              echo "::warning file=$t::suite failed once; running it again"
              HOME="$(mktemp -d)" bash "$t" || { fail=1; echo "::error file=$t::suite failed twice"; }
            fi
            echo "::endgroup::"
          done
          exit "$fail"

  windows:
    # The native PowerShell renderer and installer. test-statusline-ps1.ps1 runs
    # differential checks against statusline.sh with Git Bash as the oracle, so
    # this leg also puts the Bash renderer on Git Bash.
    name: PowerShell suites (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Git for Windows converts line endings by default; the Bash scripts and
      # the byte-exact fixtures need the files as they are in the repository.
      - name: Keep line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Versions
        shell: powershell
        run: |
          "Windows PowerShell $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Output "::error::this leg must run Windows PowerShell 5.1"; exit 1 }
          # Each tool is checked on its own: only the last native exit code decides a
          # step, so a missing jq would otherwise be hidden by the next command.
          & "C:\Program Files\Git\bin\bash.exe" --version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Git Bash is not where the suites expect it"; exit 1 }
          & "C:\Program Files\Git\bin\bash.exe" -c 'command -v jq && jq --version'
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::jq is not on Git Bash's PATH; the Bash oracle cannot run"; exit 1 }
          git --version
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::git is missing"; exit 1 }
      # The suite's git segment case needs a repository on a branch named main; a
      # pull-request checkout is a detached HEAD. Snapshot the tree into one.
      - name: Snapshot into a repository on branch main
        shell: bash
        run: |
          rm -rf .git
          git init -q -b main
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm snapshot
      # The suites start child processes through .NET Framework's Process class,
      # which prefixes the child's stdin with a BOM under this runner's UTF-8
      # console code page; each suite sets a preamble-free input encoding first
      # (see the note at its top).
      # A suite passes only with exit 0 AND a summary line that says blocked=0:
      # both suites skip whole sections as BLOCKED (no Git Bash, no jq, no junction
      # support) without failing, which would leave this job green over cases
      # that never ran. A failed attempt is run once more before it counts, as the
      # bash job does: several cases are bounded by wall-clock time.
      - name: test-statusline-ps1
        id: statusline
        shell: powershell
        run: |
          $ok = $false
          foreach ($attempt in 1, 2) {
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test\test-statusline-ps1.ps1 2>&1 | Tee-Object -FilePath statusline-suite.log
            $code = $LASTEXITCODE
            $summary = Select-String -Path statusline-suite.log -Pattern '^SUMMARY pass=\d+ fail=0 blocked=0\s*$' -Quiet
            if ($code -eq 0 -and $summary) { $ok = $true; break }
            if ($attempt -eq 1) { Write-Output "::warning::test-statusline-ps1 failed once (exit $code); running it again" }
          }
          if (-not $ok) { Write-Output "::error::test-statusline-ps1 failed, or cases were blocked (exit $code)"; exit 1 }
      # Runs after a failure of the renderer suite, but not when the setup above
      # failed and the renderer suite never started.
      - name: test-install-ps1
        if: ${{ !cancelled() && steps.statusline.conclusion != 'skipped' }}
        shell: powershell
        run: |
          $ok = $false
          foreach ($attempt in 1, 2) {
            powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test\test-install-ps1.ps1 2>&1 | Tee-Object -FilePath install-suite.log
            $code = $LASTEXITCODE
            $summary = Select-String -Path install-suite.log -Pattern '^RESULT\s+pass=\d+ fail=0 blocked=0\s*$' -Quiet
            if ($code -eq 0 -and $summary) { $ok = $true; break }
            if ($attempt -eq 1) { Write-Output "::warning::test-install-ps1 failed once (exit $code); running it again" }
          }
          if (-not $ok) { Write-Output "::error::test-install-ps1 failed, or cases were blocked (exit $code)"; exit 1 }
