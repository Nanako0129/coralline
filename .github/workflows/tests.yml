name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces the older run. A push to main gets a
# group of its own (the commit), so no run on main is cancelled or left pending
# behind another: each merge commit keeps its own result, and a break is
# attributed to the commit that caused it.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bash:
    # ubuntu-latest has bash 5 on PATH; macos-latest has only the stock bash 3.2,
    # the oldest shell the renderer supports. The Versions step fails if that
    # stops being true, so the macOS leg cannot silently stop covering 3.2.
    name: bash suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          bash --version | head -1
          jq --version
          git --version
          if [ "$RUNNER_OS" = macOS ]; then
            case "$(bash -c 'printf %s "$BASH_VERSION"')" in
              3.2.*) ;;
              *) echo "::error::the macOS runner's bash is no longer 3.2; this leg must run the suites under /bin/bash"; exit 1 ;;
            esac
          fi
      # One file per invocation: `bash -n a b c` checks only a and passes the
      # rest to it as arguments.
      - name: Syntax
        run: |
          fail=0
          for f in statusline.sh configure.sh install.sh example/float-display-iterm2/coralline-float test/*.sh; do
            bash -n "$f" || { fail=1; echo "::error file=$f::syntax error"; }
          done
          exit "$fail"
      # Every suite exits non-zero on a failed case. The loop keeps going so one
      # run names every failing suite. Each suite gets an empty HOME of its own, so
      # here whatever a suite reads or leaves under ~/.claude is its own and the
      # result does not depend on the order of the suites. That isolation is this
      # workflow's: run by hand, a suite uses the real HOME.
      # A failed suite is run once more before it counts: several cases bound
      # real concurrency by wall-clock time (test-burn's 32 simultaneous renders
      # with one writer per second), written for a local machine, and a loaded
      # shared runner can overrun them. A real break fails both times; a retry
      # leaves a warning on the run so a recurring one is seen.
      - name: Suites
        run: |
          fail=0
          for t in test/*.sh; do
            echo "::group::$t"
            if ! HOME="$(mktemp -d)" bash "$t"; then
              echo "::warning file=$t::suite failed once; running it again"
              HOME="$(mktemp -d)" bash "$t" || { fail=1; echo "::error file=$t::suite failed twice"; }
            fi
            echo "::endgroup::"
          done
          exit "$fail"

  windows:
    # The native PowerShell renderer and installer. test-statusline-ps1.ps1 runs
    # differential checks against statusline.sh with Git Bash as the oracle, so
    # this leg also puts the Bash renderer on Git Bash.
    name: PowerShell suites (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Git for Windows converts line endings by default; the Bash scripts and
      # the byte-exact fixtures need the files as they are in the repository.
      - name: Keep line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Versions
        shell: powershell
        run: |
          "Windows PowerShell $($PSVersionTable.PSVersion)"
          & "C:\Program Files\Git\bin\bash.exe" --version | Select-Object -First 1
          & "C:\Program Files\Git\bin\bash.exe" -c 'command -v jq && jq --version'
          git --version
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Output "::error::this leg must run Windows PowerShell 5.1"; exit 1 }
      # The suite's git segment case needs a repository on a branch named main; a
      # pull-request checkout is a detached HEAD. Snapshot the tree into one.
      - name: Snapshot into a repository on branch main
        shell: bash
        run: |
          rm -rf .git
          git init -q -b main
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm snapshot
      # TEMPORARY diagnostic: the first hosted run rendered nothing from
      # statusline.ps1 (exit 0, empty stdout and stderr). Remove once explained.
      - name: Diagnose native render (temporary)
        continue-on-error: true
        shell: powershell
        run: |
          "--- as Claude Code runs it (stdin redirected from a file)"
          cmd /c "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File statusline.ps1 < test\sample-input.json > out.txt 2> err.txt"
          "exit=$LASTEXITCODE stdout_bytes=$((Get-Item out.txt).Length) stderr_bytes=$((Get-Item err.txt).Length)"
          Get-Content err.txt -TotalCount 20
          "--- in-process, errors kept"
          $Error.Clear()
          try { Get-Content test\sample-input.json -Raw | & .\statusline.ps1 | Out-File out2.txt } catch { "THROWN: " + ($_ | Out-String) }
          "stdout_bytes=$((Get-Item out2.txt -ErrorAction SilentlyContinue).Length) errors=$($Error.Count)"
          $Error | Select-Object -First 5 | ForEach-Object { ($_ | Out-String).Trim(); $_.ScriptStackTrace }
          "--- environment facts"
          "USERPROFILE set: $([bool]$env:USERPROFILE) HOME set: $([bool]$env:HOME) CLAUDE_CONFIG_DIR set: $([bool]$env:CLAUDE_CONFIG_DIR) CI set: $([bool]$env:CI)"
          "cwd: $(Get-Location) culture: $([Globalization.CultureInfo]::CurrentCulture.Name) codepage: $([Console]::OutputEncoding.CodePage)"
      - name: test-statusline-ps1
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test\test-statusline-ps1.ps1
      - name: test-install-ps1
        if: ${{ !cancelled() }}
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test\test-install-ps1.ps1
