name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces the older run. A push to main gets a
# group of its own (the commit), so no run on main is cancelled or left pending
# behind another: each merge commit keeps its own result, and a break is
# attributed to the commit that caused it.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bash:
    # ubuntu-latest has bash 5 on PATH; macos-latest has only the stock bash 3.2,
    # the oldest shell the renderer supports. The Versions step fails if that
    # stops being true, so the macOS leg cannot silently stop covering 3.2.
    name: bash suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          bash --version | head -1
          jq --version
          git --version
          if [ "$RUNNER_OS" = macOS ]; then
            case "$(bash -c 'printf %s "$BASH_VERSION"')" in
              3.2.*) ;;
              *) echo "::error::the macOS runner's bash is no longer 3.2; this leg must run the suites under /bin/bash"; exit 1 ;;
            esac
          fi
      # One file per invocation: `bash -n a b c` checks only a and passes the
      # rest to it as arguments.
      - name: Syntax
        run: |
          fail=0
          for f in statusline.sh configure.sh install.sh example/float-display-iterm2/coralline-float test/*.sh; do
            bash -n "$f" || { fail=1; echo "::error file=$f::syntax error"; }
          done
          exit "$fail"
      # Every suite exits non-zero on a failed case. The loop keeps going so one
      # run names every failing suite. Each suite gets an empty HOME of its own, so
      # here whatever a suite reads or leaves under ~/.claude is its own and the
      # result does not depend on the order of the suites. That isolation is this
      # workflow's: run by hand, a suite uses the real HOME.
      # A failed suite is run once more before it counts: several cases bound
      # real concurrency by wall-clock time (test-burn's 32 simultaneous renders
      # with one writer per second), written for a local machine, and a loaded
      # shared runner can overrun them. A real break fails both times; a retry
      # leaves a warning on the run so a recurring one is seen.
      - name: Suites
        run: |
          fail=0
          for t in test/*.sh; do
            echo "::group::$t"
            if ! HOME="$(mktemp -d)" bash "$t"; then
              echo "::warning file=$t::suite failed once; running it again"
              HOME="$(mktemp -d)" bash "$t" || { fail=1; echo "::error file=$t::suite failed twice"; }
            fi
            echo "::endgroup::"
          done
          exit "$fail"

  windows:
    # The native PowerShell renderer and installer. test-statusline-ps1.ps1 runs
    # differential checks against statusline.sh with Git Bash as the oracle, so
    # this leg also puts the Bash renderer on Git Bash.
    name: PowerShell suites (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Git for Windows converts line endings by default; the Bash scripts and
      # the byte-exact fixtures need the files as they are in the repository.
      - name: Keep line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Versions
        shell: powershell
        run: |
          "Windows PowerShell $($PSVersionTable.PSVersion)"
          & "C:\Program Files\Git\bin\bash.exe" --version | Select-Object -First 1
          & "C:\Program Files\Git\bin\bash.exe" -c 'command -v jq && jq --version'
          git --version
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Output "::error::this leg must run Windows PowerShell 5.1"; exit 1 }
      # The suite's git segment case needs a repository on a branch named main; a
      # pull-request checkout is a detached HEAD. Snapshot the tree into one.
      - name: Snapshot into a repository on branch main
        shell: bash
        run: |
          rm -rf .git
          git init -q -b main
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm snapshot
      # TEMPORARY diagnostic: in the suite every launch of statusline.ps1 returns
      # exit 0 with empty stdout on the hosted runner, while a direct run renders.
      # This launches it the way the suite does and changes one factor at a time.
      # Remove once explained.
      - name: Diagnose the suite's launch (temporary)
        continue-on-error: true
        shell: powershell
        run: |
          $repo = (Get-Location).Path
          $json = [IO.File]::ReadAllBytes((Join-Path $repo 'test\sample-input.json'))
          $exe = (Get-Process -Id $PID).Path
          "host exe: $exe"
          function Launch([string]$label, [hashtable]$vars, [string]$cwd, [bool]$noWindow, [string]$script) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe
            $psi.Arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '"'
            $psi.UseShellExecute = $false
            $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true
            $psi.CreateNoWindow = $noWindow
            if ($cwd) { $psi.WorkingDirectory = $cwd }
            foreach ($k in $vars.Keys) { if ($null -eq $vars[$k]) { [void]$psi.EnvironmentVariables.Remove($k) } else { $psi.EnvironmentVariables[$k] = [string]$vars[$k] } }
            $p = New-Object System.Diagnostics.Process; $p.StartInfo = $psi; [void]$p.Start()
            $o = $p.StandardOutput.BaseStream; $e = $p.StandardError.BaseStream
            $om = New-Object IO.MemoryStream; $em = New-Object IO.MemoryStream
            $ot = $o.CopyToAsync($om); $et = $e.CopyToAsync($em)
            if ($script:DelayMs -gt 0) { Start-Sleep -Milliseconds $script:DelayMs }
            $p.StandardInput.BaseStream.Write($json, 0, $json.Length); $p.StandardInput.BaseStream.Flush(); $p.StandardInput.Close()
            [void]$p.WaitForExit(20000); [void]$ot.Wait(2000); [void]$et.Wait(2000)
            "{0,-44} exit={1} stdout={2} stderr={3}" -f $label, $p.ExitCode, $om.Length, $em.Length
            if ($em.Length -gt 0) { [Text.Encoding]::UTF8.GetString($em.ToArray()).Substring(0, [Math]::Min(600, $em.Length)) }
            if ($script:ShowOut) { ([Text.Encoding]::UTF8.GetString($om.ToArray())).Replace([string][char]27, '<ESC>').Trim() }
          }
          $script:DelayMs = 0; $script:ShowOut = $false
          "payload bytes: $($json.Length), first byte: $($json[0]), last byte: $($json[$json.Length - 1])"
          $script = Join-Path $repo 'statusline.ps1'
          $rt = Join-Path ([IO.Path]::GetTempPath()) 'coralline-diag-home'
          Launch 'plain, window allowed'               @{} $repo $false $script
          Launch 'plain, CreateNoWindow'               @{} $repo $true  $script
          Launch 'NO_SAMPLE=1'                         @{ CORALLINE_NO_SAMPLE='1' } $repo $true $script
          Launch 'profile dir missing'                 @{ HOME=($rt -replace '\\','/'); USERPROFILE=$rt } $repo $true $script
          New-Item -ItemType Directory -Force $rt | Out-Null
          Launch 'profile dir present'                 @{ HOME=($rt -replace '\\','/'); USERPROFILE=$rt } $repo $true $script
          Launch 'suite vars, all of them'             @{ HOME=($rt -replace '\\','/'); USERPROFILE=$rt; CORALLINE_CONFIG=$null; CORALLINE_NO_SAMPLE='1'; CORALLINE_TEST_NOW=$null; REMORA_ACTIVE=$null; VIRTUAL_ENV=$null; CONDA_DEFAULT_ENV=$null } $repo $true $script
          "--- the renderer's own view when it is launched that way"
          $probe = Join-Path $repo 'probe.ps1'
          Set-Content -Path $probe -Encoding ascii -Value @'
          try { $s = [Console]::OpenStandardInput(); $r = New-Object IO.StreamReader($s); $t = $r.ReadToEnd(); "stdin chars: $($t.Length)" } catch { "stdin failed: $_" }
          try { "pipeline input items: $(@($input).Count)" } catch { "input failed: $_" }
          try { "in redirected: $([Console]::IsInputRedirected) out encoding: $([Console]::OutputEncoding.WebName)" } catch { "console failed: $_" }
          '@
          $script:ShowOut = $true
          Launch 'probe, write at once' @{} $repo $true $probe
          $script:DelayMs = 3000
          Launch 'probe, write after 3 s' @{} $repo $true $probe
          Launch 'renderer, write after 3 s' @{} $repo $true $script
          $script:DelayMs = 0
          "--- the same payload from a file handle instead of a pipe"
          cmd /c "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File probe.ps1 < test\sample-input.json"
          "--- and through a cmd pipe"
          cmd /c "type test\sample-input.json | powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File probe.ps1"
          cmd /c "type test\sample-input.json | powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File statusline.ps1 > piped.txt"
          "renderer through a cmd pipe: stdout=$((Get-Item piped.txt).Length)"
      - name: test-statusline-ps1
        # A long-form temp directory: the runner's own one is suspected to be an
        # 8.3 short path (C:\Users\RUNNER~1\...), which the renderer's config path
        # checks refuse.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test\test-statusline-ps1.ps1
      - name: test-install-ps1
        if: ${{ !cancelled() }}
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File test\test-install-ps1.ps1
