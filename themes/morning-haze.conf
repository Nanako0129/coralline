# coralline theme: morning-haze
# Muted morning pastels: hazy periwinkle path, sage-green git, sandstone clock,
# on deep slate-blue gauge segments. Every pill gets its own hue step so no two
# segments repeat, while the role semantics stay intact (green clean, amber
# dirty, warm cost).
VL_BG_DIR="161,181,216"        # sky serenade   (periwinkle haze)
VL_BG_PROJECT="204,217,236"    # sky mist       (lighter kin of dir)
VL_BG_GIT_OK="194,216,185"     # sage whisper   (git clean)
VL_BG_STASH="220,233,207"      # pale mint      (stash; lighter than git_ok)
VL_BG_GIT_DIRTY="233,204,151"  # sand gold      (git dirty)
VL_BG_MODEL="196,183,220"      # lavender haze
VL_BG_CTX="47,54,68"           # deep slate     (dark data segment)
VL_BG_5H="42,48,60"            # slate shadow   (dark data segment)
VL_BG_7D="37,42,52"            # night slate    (dark data segment)
VL_BG_COST="238,185,159"       # terracotta bloom
VL_BG_CLOCK="248,230,210"      # sandstone bloom
VL_BG_LINES="57,65,82"         # dusk slate     (dark, so the +/- text reads)
VL_BG_STYLE="213,206,198"      # warm ash
VL_BG_DURATION="158,195,192"   # misty teal
VL_BG_EFFORT="220,192,210"     # dusty rose

VL_FG_TEXT="42,49,66"          # ink slate (dark text on the pastel pills)
VL_FG_DIM="129,145,173"        # sky serenade dark (muted token text on dark segments)
VL_FG_OK="183,214,166"         # bright sage    (gauge low)
VL_FG_WARN="235,201,142"       # bright sand    (gauge mid)
VL_FG_HOT="227,150,143"        # muted coral    (gauge high)
VL_BG_NODE="168,201,140"       # leaf green     (deeper than git_ok)
VL_BG_PYTHON="143,184,214"     # hazy azure     (Python hue)

# Subagent panel: subseg_name tints the label by task status out of the main
# VL_FG_* palette, which is tuned for the gauge segments' dark ground. Giving the
# name pill that same ground keeps every status legible in this theme's own light
# inks. Targets are WCAG AA for normal-size text (terminal type is not 'large'
# even in bold), checked against both this pill and the uniform bar
# VL_STYLE="classic" paints instead; running sits a step higher so it never
# collides with the dim tint. These are candidates, not the public knobs:
# statusline.sh adopts them only while _VL_SUB_FP / _VL_SUB_BAR still match the live
# palette and bar, so a config that retints either after sourcing this theme keeps
# its own colors. Both are literals, not interpolations, so a value assigned before
# this theme is sourced cannot be captured as theme-approved.
_VL_SUB_BG_NAME="47,54,68"     # deep slate, matching VL_BG_CTX
_VL_SUB_FG_TEXT="190,204,228"  # running (7.48 pill / 6.00 classic bar), lifted sky serenade
_VL_SUB_FG_OK=""               # completed falls through at 7.61 / 6.11
_VL_SUB_FG_HOT="229,159,152"   # failed (5.63 / 4.52)
_VL_SUB_FG_DIM="166,177,197"   # unknown (5.61 / 4.51)
_VL_SUB_FP="161,181,216|42,49,66|183,214,166|227,150,143|129,145,173"
_VL_SUB_BAR="|"
