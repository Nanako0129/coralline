# Subagent panel: subseg_name tints the label by task status out of the main
# VL_FG_* palette, which is tuned for the gauge segments' dark ground. Giving the
# name pill that same ground keeps every status legible in this theme's own light
# inks. Targets are WCAG AA for normal-size text (terminal type is not 'large'
# even in bold), checked against both this pill and the uniform bar
# VL_STYLE="classic" paints instead; running sits a step higher so it never
# collides with the dim tint. These are candidates, not the public knobs:
# statusline.sh adopts them only while _VL_SUB_FP still matches the live palette,
# so a config that retints VL_FG_* after sourcing this theme keeps its own colors.
_VL_SUB_BG_NAME="67,76,94"     # dark ground, same family as the gauge segments
_VL_SUB_FG_TEXT="190,221,229"  # running (6.02 pill / 6.80 classic bar)
