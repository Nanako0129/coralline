# coralline theme: reverie
# Soft designer pastels as pills with a plum-tinted dark text, mapped onto
# claude-coral's roles (blue path, pink model, pink cost, lavender effort);
# warm-dark neutral gauge segments.
VL_BG_DIR="114,152,199"        # blue grey
VL_BG_PROJECT="164,216,255"    # icy blue
VL_BG_GIT_OK="168,200,158"     # sage green   (git clean)
VL_BG_STASH="196,222,186"      # mint green   (stash; lighter, distinct from git)
VL_BG_GIT_DIRTY="243,217,143"  # morning butter
VL_BG_MODEL="249,168,187"      # cherry blossom
VL_BG_CTX="53,57,60"           # gunmetal     (dark data segment)
VL_BG_5H="51,41,39"            # deep mocha   (dark data segment)
VL_BG_7D="62,39,35"            # espresso     (dark data segment)
VL_BG_COST="244,201,214"       # peony
VL_BG_CLOCK="245,241,230"      # soft linen
VL_BG_LINES="53,57,60"         # gunmetal     (dark, so the +/- text reads)
VL_BG_STYLE="214,200,223"      # thistle
VL_BG_DURATION="164,216,255"   # icy blue
VL_BG_EFFORT="229,230,250"     # lavender

VL_FG_TEXT="56,40,66"          # plum (tinted dark text on the pastel pills)
VL_FG_DIM="114,152,199"        # blue grey (muted token text on dark segments)
VL_FG_OK="164,216,255"         # icy blue       (gauge low)
VL_FG_WARN="243,217,143"       # morning butter (gauge mid)
VL_FG_HOT="249,168,187"        # cherry blossom (gauge high)
VL_BG_NODE="146,204,120"
VL_BG_PYTHON="125,175,222"     # pastel azure (Python hue)

# Subagent panel: subseg_name tints the label by task status out of the main
# VL_FG_* palette, which is tuned for the gauge segments' dark ground. Giving the
# name pill that same ground keeps every status legible in this theme's own light
# inks. Targets are WCAG AA for normal-size text (terminal type is not 'large'
# even in bold), checked against both this pill and the uniform bar
# VL_STYLE="classic" paints instead; running sits a step higher so it never
# collides with the dim tint. These are candidates, not the public knobs:
# statusline.sh adopts them only while _VL_SUB_FP still matches the live palette,
# so a config that retints VL_FG_* after sourcing this theme keeps its own colors.
_VL_SUB_BG_NAME="53,57,60"     # dark ground, same family as the gauge segments
_VL_SUB_FG_TEXT="186,205,228"  # running (7.18 pill / 6.00 classic bar)
_VL_SUB_FG_OK=""               # completed falls through at 7.68 / 6.42
_VL_SUB_FG_HOT=""              # failed falls through at 6.30 / 5.26
_VL_SUB_FG_DIM="150,179,213"   # unknown (5.39 / 4.50)
_VL_SUB_FP="114,152,199|56,40,66|164,216,255|249,168,187|114,152,199"
_VL_SUB_BAR="|"
