# coralline theme: mono
# Grayscale — for minimalists and limited-color terminals
# classic style only: the segment colours are a tight gray ramp, so pin the bar
# darker than all of them (below 235) — the default 238 would swallow the darker
# labels. Ignored by pill/lean.
VL_BG_BAR=234
VL_BG_DIR=240
VL_BG_GIT_OK=238
VL_BG_GIT_DIRTY=244
VL_BG_MODEL=242
VL_BG_CTX=235
VL_BG_5H=234
VL_BG_7D=233
VL_BG_COST=246
VL_BG_CLOCK=237
VL_BG_LINES=235
VL_BG_STYLE=243
VL_BG_DURATION=236
VL_BG_EFFORT=245

VL_FG_TEXT=255
VL_FG_DIM=245
VL_FG_OK=252
VL_FG_WARN=250
VL_FG_HOT=231
VL_BG_NODE="237"
VL_BG_PYTHON="234"

# Subagent panel: subseg_name tints the label by task status out of the main
# VL_FG_* palette, which is tuned for the gauge segments' dark ground. Giving the
# name pill that same ground keeps every status legible in this theme's own light
# inks. Targets are WCAG AA for normal-size text (terminal type is not 'large'
# even in bold), checked against both this pill and the uniform bar
# VL_STYLE="classic" paints instead; running sits a step higher so it never
# collides with the dim tint. These are candidates, not the public knobs:
# statusline.sh adopts them only while _VL_SUB_FP still matches the live palette,
# so a config that retints VL_FG_* after sourcing this theme keeps its own colors.
_VL_SUB_BG_NAME="38,38,38"     # dark ground, same family as the gauge segments
_VL_SUB_FG_TEXT="238,238,238"  # running (13.04 pill / 8.39 classic bar)
_VL_SUB_FG_OK=""               # completed falls through at 9.81 / 6.31
_VL_SUB_FG_HOT=""              # failed falls through at 15.13 / 9.74
_VL_SUB_FG_DIM="177,177,177"   # unknown (7.06 / 4.54)
_VL_SUB_FP="240|255|252|231|245"
_VL_SUB_BAR="234|"
